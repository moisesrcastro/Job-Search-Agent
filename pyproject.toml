[project]
name = "langchain-first-steps"
version = "0.1.0"
description = ""
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]>=0.136.1,<0.137.0",
    "langchain (>=1.3.0,<2.0.0)",
    "openrouter (>=0.9.1,<0.10.0)"
]

[tool.poetry]
packages = [{ include = "langchain_first_steps", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff>=0.15.12,<0.16.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "taskipy>=1.14.1,<2.0.0",
    "langgraph-cli[inmem] (>=0.4.26,<0.5.0)"
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini-options]
pythonpath = "."
addopts = "-p no:warnings"

[tool.taskipy.tasks]
lint = "ruff check"
format = "ruff format"
run = "fastapi dev src/langchain_first_steps/app.py"
test = "pytest -s -x --cov=langchain_first_steps"
pre_test = "task lint"
pre_format = "ruff check --fix"
post_test = "coverage html"