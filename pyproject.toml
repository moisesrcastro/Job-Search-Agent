[project]
name = "job-search-agent"
version = "0.1.0"
description = "AI Job Search Agent built with LangGraph and OpenRouter"
authors = [
    { name = "Moises Rocha Castro" }
]
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [

    # API
    "fastapi[standard]>=0.136.1,<0.137.0",

    # LLM
    "langchain>=1.3.0,<2.0.0",
    "openrouter>=0.9.1,<0.10.0",

    # LangGraph
    "langgraph>=1.0.0",

    # Memory
    "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",

    # Database
    "sqlalchemy>=2.0.40",

    # HTTP
    "httpx>=0.28.1",

    # Config
    "python-dotenv>=1.1.1",

    # Validation
    "pydantic>=2.11.7",
    "asyncpg (>=0.31.0,<0.32.0)"
]

[tool.poetry]
packages = [
    { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]

dev = [

    "ruff>=0.15.12,<0.16.0",

    "pytest>=9.0.3,<10.0.0",

    "pytest-cov>=7.1.0,<8.0.0",

    "taskipy>=1.14.1,<2.0.0",

    "langgraph-cli[inmem]>=0.4.26,<0.5.0"
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini-options]
pythonpath = "."
addopts = "-p no:warnings"

[tool.taskipy.tasks]
lint = "ruff check"
format = "ruff format"
test = "pytest -s -x"
pre_test = "task lint"
pre_format = "ruff check --fix"